name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      only-markdown: ${{ steps.check.outputs.only-markdown }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Check if only existing markdown files were modified
        id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          # First push to a branch has no meaningful base
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "only-markdown=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-status "$BASE" "${{ github.sha }}")
          if [ -z "$changed" ]; then
            echo "only-markdown=false" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$changed" | awk 'NF && ($1 != "M" || $2 !~ /\.md$/) { exit 1 }'; then
            echo "only-markdown=true" >> "$GITHUB_OUTPUT"
          else
            echo "only-markdown=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint (Node 22)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          HUSKY: '0'
      - run: npm run verify:build
        if: needs.changes.outputs.only-markdown != 'true'
      - run: npm run lint:eslint
        if: needs.changes.outputs.only-markdown != 'true'
      - run: npm run lint:json
        if: needs.changes.outputs.only-markdown != 'true'
      - run: npm run lint:markdown
      - run: npm run lint:yaml
        if: needs.changes.outputs.only-markdown != 'true'
      - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        if: needs.changes.outputs.only-markdown != 'true'
        with:
          dockerfile: docker/Dockerfile.template
      - name: Install shellcheck
        if: needs.changes.outputs.only-markdown != 'true'
        run: sudo apt-get install -y shellcheck
      - run: npm run lint:shell
        if: needs.changes.outputs.only-markdown != 'true'
      - run: npm run typecheck
        if: needs.changes.outputs.only-markdown != 'true'

  test:
    name: Test (Node 22, MongoDB ${{ matrix.mongodb-version }})
    needs: changes
    if: needs.changes.outputs.only-markdown != 'true'
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:${{ matrix.mongodb-version }}
        # SERVER-121912 tcmalloc-google / kernel 6.19 rseq workaround — see docker/init.sh:25
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        mongodb-version: ['8.2', '8.0', '7.0']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          HUSKY: '0'
      - name: Start Mongo shell client
        run: |
          # The mongodb service has already pulled this image; avoid a duplicate registry pull.
          docker run --detach --rm --pull never \
            --name variety-mongosh-client \
            --network host \
            --volume "$PWD:$PWD" \
            --workdir "$PWD" \
            mongo:${{ matrix.mongodb-version }} \
            tail -f /dev/null
      - run: npm run test:mocha
        env:
          MONGO_SHELL_COMMAND: ./test/bin/mongosh-in-service-container.sh

  test-legacy:
    name: Test (Node 22, MongoDB 5.0)
    needs: changes
    if: needs.changes.outputs.only-markdown != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          HUSKY: '0'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - name: Expose GitHub Actions cache runtime
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - run: mkdir -p docker/Dockerfiles
      - run: npm run test:container
        env:
          MONGODB_VERSION: '5.0'
          NODEJS_VERSION: '22'
          DOCKER_BUILD_CACHE: gha
          DOCKER_BUILD_CACHE_SCOPE: variety-test-${{ runner.os }}-${{ runner.arch }}-mongodb-5.0-node-22

  test-smoke:
    name: Smoke Test (Node 24, MongoDB 8.2)
    needs: changes
    if: needs.changes.outputs.only-markdown != 'true'
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.2
        # SERVER-121912 tcmalloc-google / kernel 6.19 rseq workaround — see docker/init.sh:25
        env:
          GLIBC_TUNABLES: glibc.pthread.rseq=1
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          HUSKY: '0'
      - name: Start Mongo shell client
        run: |
          # The mongodb service has already pulled this image; avoid a duplicate registry pull.
          docker run --detach --rm --pull never \
            --name variety-mongosh-client \
            --network host \
            --volume "$PWD:$PWD" \
            --workdir "$PWD" \
            mongo:8.2 \
            tail -f /dev/null
      - run: npm run test:mocha
        env:
          MONGO_SHELL_COMMAND: ./test/bin/mongosh-in-service-container.sh

  required-ci-gate:
    name: Required CI Gate
    needs: [changes, lint, test, test-legacy, test-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required CI result
        env:
          ONLY_MARKDOWN: ${{ needs.changes.outputs.only-markdown }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_LEGACY_RESULT: ${{ needs.test-legacy.result }}
          SMOKE_RESULT: ${{ needs.test-smoke.result }}
        run: |
          {
            echo "### Required CI Gate"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Detect changes | $CHANGES_RESULT |"
            echo "| Lint | $LINT_RESULT |"
            echo "| Test matrix | $TEST_RESULT |"
            echo "| Legacy test | $TEST_LEGACY_RESULT |"
            echo "| Smoke test | $SMOKE_RESULT |"
            echo
            echo "only-markdown: \`$ONLY_MARKDOWN\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Detect changes did not succeed." >&2
            exit 1
          fi

          if [ "$LINT_RESULT" != "success" ]; then
            echo "Lint did not succeed." >&2
            exit 1
          fi

          if [ "$ONLY_MARKDOWN" = "true" ]; then
            if [ "$TEST_RESULT" != "skipped" ] || [ "$TEST_LEGACY_RESULT" != "skipped" ] || [ "$SMOKE_RESULT" != "skipped" ]; then
              echo "Markdown-only changes should skip test jobs; got test=$TEST_RESULT legacy=$TEST_LEGACY_RESULT smoke=$SMOKE_RESULT." >&2
              exit 1
            fi

            echo "Markdown-only change: tests were intentionally skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$TEST_RESULT" != "success" ]; then
            echo "Test matrix did not succeed." >&2
            exit 1
          fi

          if [ "$TEST_LEGACY_RESULT" != "success" ]; then
            echo "Legacy test did not succeed." >&2
            exit 1
          fi

          if [ "$SMOKE_RESULT" != "success" ]; then
            echo "Smoke test did not succeed." >&2
            exit 1
          fi

          echo "Full CI passed." >> "$GITHUB_STEP_SUMMARY"
